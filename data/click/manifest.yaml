- id: click-3495fba
  query: "help not resolving automatically\n\nFrom the docs: \r\n\r\nThe help parameter is implemented\
    \ in Click in a very special manner. Unlike regular parameters it’s automatically added by Click for\
    \ any command and it performs automatic conflict resolution. By default it’s called --help, but this\
    \ can be changed. If a command itself implements a parameter with the same name, the default help\
    \ parameter stops accepting it. There is a context setting that can be used to override the names\
    \ of the help parameters called [help_option_names](https://click.palletsprojects.com/en/stable/api/#click.Context.help_option_names).\r\
    \n\r\nWhat is wrong: \r\nHelp does not automatically resolve if there is an arg or kwarg called help.\
    \ In the sample the file is called help.py\r\n\r\n``` \r\nimport click\r\n\r\n# This works \r\n@click.command()\r\
    \n@click.argument('helps')\r\ndef this_works(helps):\r\n    print(helps)\r\n\r\n# > python -m help\
    \ this\r\n# this\r\n\r\n# > python -m help --help\r\n# Usage: help.py [OPTIONS] HELPS\r\n\r\n# Options:\r\
    \n#   --help  Show this message and exit.\r\n\r\n# This does not work\r\n@click.command()\r\n@click.argument('help')\r\
    \ndef this_does_not_work(help):\r\n    print(help)\r\n\r\n# > python -m help this\r\n# Usage: help.py\
    \ [OPTIONS] HELP\r\n# Try 'help.py --help' for help.\r\n\r\n# Error: Invalid value for '--help': 'this'\
    \ is not a valid boolean.\r\n\r\n# > python -m help --help\r\n# Usage: help.py [OPTIONS] HELP\r\n\
    # Try 'help.py --help' for help.\r\n\r\n# Error: Missing argument 'HELP'.\r\n\r\n# This does not work\r\
    \n@click.command()\r\n@click.option('--h"
