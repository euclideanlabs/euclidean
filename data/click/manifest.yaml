- id: click-c6bf75f
  query: "`launch()` cannot locate files with spaces in the name on Windows\n\n_Related to #2868 but with\
    \ files and `locate=True`_\n\n## Problem\n\nWhen a Windows program uses `click.launch(some_path, locate=True)`\
    \ and `some_path` contains spaces, then Windows Explorer opens showing the user's Documents folder\
    \ and not the specified file.\n\nDispatching the call to `powershell` and not `cmd` seems to fix the\
    \ problem.\n\n## Reproduction\n\n```pwsh\n# Prepare and enter the virtual environment\nmkdir click-demo\n\
    cd click-demo\npython -m venv --upgrade-deps .venv\n.\\.venv\\Scripts\\activate.ps1\n\n# Check versions\n\
    pip -V\n# pip 25.1.1 from X:\\scratch\\click-demo\\.venv\\Lib\\site-packages\\pip (python 3.11)\n\n\
    # Install click\npip install click\n\n# Check environment\npip list\n# Package    Version\n# ----------\
    \ -------\n# click      8.2.1\n# colorama   0.4.6\n# pip        25.1.1\n# setuptools 80.9.0\n```\n\
    \n**`click-demo.py`**\n```python\nimport pathlib\nimport subprocess\n\nimport click\n\n# No spaces\
    \ in this path\nroot_folder = pathlib.Path(\"C:\\\\Users\\\\Public\")\n\n# No spaces in this path\n\
    succeeding_folder = root_folder / \"click-demo\"\nsucceeding_folder.mkdir(exist_ok=True)\nclick.launch(str(succeeding_folder),\
    \ locate=True)\n\n# Path has spaces!\nfailing_folder = root_folder / \"click demo\"\nfailing_folder.mkdir(exist_ok=True)\n\
    click.launch(str(failing_folder), locate=True)\n\n# Wrap with powershell\nsubprocess.run(\n    [\n\
    \        \"powershell\",\n        \"-Command\",\n        f\"explorer /select,{failing_folder!s}\"\
    ,\n    ],\n    check=True,\n)\n```\n\nEnvironme"
