- id: click-2468b70
  query: 'backspace and line-wrapping acting strange on Linux


    When running any app using click.prompt on linux, something weird happens with backspace.


    ### Recording

    This screen recording shows 2 letters being removed when I hit backspace once, and the prompt being
    deleted when I backspace the entire line.


    ![Image](https://github.com/user-attachments/assets/dd505b9f-b412-49e0-aceb-d878cd291552)

    ([asciinema link](https://asciinema.org/a/qWORhMIcnEuG3iLtLvm9FwkhY))


    The returned input is also different from the text shown on screen.


    ### Environment:


    - Python version: 3.13.3

    - Click version: 8.2.1


    ### Cause:


    termui contains a workaround for windows where it prints a readline prompt itself. On linux, this
    confuses readline so things like backspace/ctrl-backspace and line wrapping don''t work correctly.


    This can be fixed by letting readline handling the prompt on linux: #2969'
