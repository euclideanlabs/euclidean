- id: click-0551bf5
  query: 'Empty output from `HelpFormatter.write_usage` for a program without arguments


    If no `args` are passed to `HelpFormatter.write_usage`, the Usage line is not printed.


    ### Reproduction


    ```python

    import click


    f = click.HelpFormatter()

    f.write_usage("program")

    print(f.getvalue())

    ```


    ### Expected output

    ```

    Usage: program

    ```


    ### Actual output

    (an empty line)


    ### Environment


