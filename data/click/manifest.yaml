    \ to freeze `@version_option`.\r\n\r\nBut looking closely #2331 did not asked for a new `module_name`\
    \ field. That was my suggestion on how to address the user request.\r\n\r\nSo reframing it, #2331\
    \ is a report that `@version_option` is producing a `RuntimeError` for users in some legitimate situations.\
    \ This breaks the out-of-the-box experience of `@version_option`.\r\n\r\nIn fact, the limitation has\
    \ been pointed out by @davidism a couple of years ago at https://github.com/pallets/click/issues/1884#issuecomment-843693678:\r\
    \n> If someone figures out a way to get the distribution version from the entry point name with `importlib.metadata`,\
