- id: click-9a2d169
  query: "`types`: fix variance issues and improve type coverage\n\nThe generic types in `click.types`\
    \ were all parametrized using an invariant type parameter. This can easily lead to unexpected type\
    \ errors for downstream users. For example, type-checkers would not allow you to assign `ParamType[bool]`\
    \ to an `ParamType[int]`, even though `bool` is a subclass of `int`. This addresses these issues by\
    \ using appropriate variance for these generic type parameters.\n\nThis also fixes several other typing\
    \ issues, removing several `# type: ignore`s and `t,cast`s. \n\nI also took the parametrize some of\
    \ the typed dicts, avoid several (intrinsically type-unsafe) `Any` annotations.\n\nAnd just like https://github.com/pallets/click/pull/3422,\
    \ this also fills in the missing annotations of attributes and constants. This consequently increases\
    \ the type coverage by 2.18% (91.5% -> 93.68%).\n\nI realize there are quite a lot of changes here.\
    \ But I was afraid that spreading these out over multiple PRs would result in a merge conflict mess.\
    \ But if you want me to split this up anyway, then that's also fine as far as I'm concerned."
  query_source: pr_text
  relevant_files:
  - src/click/types.py
  relevant_symbols:
  - src/click/types.py::<module>
  - src/click/types.py::FuncParamTypeInfoDict
  - src/click/types.py::ChoiceInfoDict
  - src/click/types.py::NumberRangeInfoDict
  label_source: fix_commit
  source_ref: https://github.com/pallets/click/pull/3450
