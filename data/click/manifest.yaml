    \ 8.2.1, defining a boolean option with both a \"enable\" and \"disable\" flag option works with the\
    \ following logic:\n```\nimport click\n\n@click.command(\"foo\")\n@click.option(\"--without-xyz\"\
    , \"enable_xyz\", flag_value=False)\n@click.option(\"--with-xyz\", \"enable_xyz\", flag_value=True,\
    \ default=True)\ndef foo(enable_xyz):\n    print(f\"enable_xyz = {enable_xyz}\")\n\nfoo()\n```\n\n\
    With this code, using click 8.2.1:\n* `python foo.py --with-xyz` returns True\n* `python foo.py --without-xyz`\
    \ returns False\n* `python foo.py --with-xyz --without-xyz` returns False\n* `python foo.py --without-xyz\
    \ --with-xyz` returns True\n* `python foo.py` returns False\n\nIn click 8.3.0, the output is the same\
    \ for every case except the \"default\"  case - `python foo.py` returns True.\n\nThis is an extension\
    \ of #3111; this [pattern is used in MkDocs](https://github.com/mkdocs/mkdocs/blob/2862536793b3c67d9d83c33e0dd6d50a791928f8/mkdocs/__main__.py#L257)\
    \ (as of MkDocs 1.6.1) (see mkdocs/mkdocs#4032).\n\nHowever, the fix for #3111 (#3239) doesn't fix\
