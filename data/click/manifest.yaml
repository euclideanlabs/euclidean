- id: click-fc518e4
  query: "Fix race condition on `KeyboardInterrupt` in `Command.main()`\n\nThis PR address https://github.com/pallets/click/issues/3802\
    \ by unifying the policy that was already implemented elsewhere in the code.\r\n\r\nThis applies the\
    \ policy the pager has had since #351, where a late interrupt must not replace the intended outcome:\r\
    \nhttps://github.com/pallets/click/blob/8b19813f2bfca99f1018a587a8cf54fc959f2e5d/src/click/_termui_impl.py#L618-L632\r\
    \n\r\nSo now in `main()`, every handler takes the same two steps:\r\n- propagate when standalone mode\
    \ is off, or\r\n- collect the message and the exit code.\r\n\r\nA final step then prints the message\
    \ and exits, so a late interrupt can only lose the message, not the code.\r\n\r\nThis save one nesting\
    \ level in the `try...except` cascade of `main()`.\r\n\r\nThis is in accordance with older policy\
    \ choices from:\r\n- #2380: where we decided that the first interrupt still reaches non-standalone\
    \ callers as `Abort`, and keeps the interrupt as its `__cause__`\r\n- #2584: where we decided not\
    \ to change the `Aborted!` message\r\n\r\nWith these changes, we do not crash anymore, and a late\
    \ interrupt after a successful run now exits 0, instead of printing a traceback.\r\n\r\nThis PR also\
    \ adds stress tests that introduce random delays in the execution so we can catch regression at different\
    \ points in time with real SIGINTs.\r\n\r\nOff course we can discuss the policy we rely on and I'm\
    \ ready to change the code accordingly."
  relevant_files:
  - src/click/core.py
  relevant_symbols:
  - src/click/core.py::_echo_aborted
  - src/click/core.py::<module>
  - src/click/core.py::Command.main
