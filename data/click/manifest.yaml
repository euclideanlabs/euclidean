- id: click-c326df9
  query: "Fix closing of callbacks on CLI exit\n\nThis PR forces the context to close itself on CLI exits.\r\
    \n\r\nThis makes sure all callbacks registered by invoked options are properly called whenever a `ctx.exit()`\
    \ action is triggered. Which has the effect of preventing state leaks.\r\n\r\nThese leaks cannot be\
    \ witness in standard CLI operations, because on `ctx.exit()` call, the OS process that is running\
    \ the Python CLI will be destroyed.\r\n\r\nStill, in unittests, these state leaks will leads to flaky\
    \ and non-deterministic tests, as the `pytest`, `tox` or any other test framework will keep using\
    \ the same Python interpreter. To demonstrate this, I implemented a unit test using loggers as a fixture,\
    \ in addition to a generic unit test.\r\n\r\nChecklist:\r\n\r\n- [x] Add tests that demonstrate the\
    \ correct behavior of the change. Tests should fail without the change.\r\n- [x] Add or update relevant\
    \ docs, in the docs folder and in code.\r\n- [x] Add an entry in `CHANGES.rst` summarizing the change\
    \ and linking to the issue.\r\n- [x] Add `.. versionchanged::` entries in any relevant code docs.\r\
    \n- [x] Run `pre-commit` hooks and fix any issues.\r\n- [x] Run `pytest` and `tox`, no tests failed."
