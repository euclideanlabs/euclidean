- id: click-7d05a59
  query: "Fix `get_parameter_source()` during type conversion and eager callbacks\n\n### Summary \r\n\r\
    \nClick 8.4.0 moved `set_parameter_source()` to after `process_value()` when fixing flag-group arbitration\
    \ ([#3403](https://github.com/pallets/click/issues/3403), [#3404](https://github.com/pallets/click/pull/3404)).\
    \ That broke a case wasn't meant to change: anything that calls `get_parameter_source()` during type\
    \ conversion or in an eager callback saw `None`, even though `consume_value()` had already figured\
    \ out where the value came from ([#3458](https://github.com/pallets/click/issues/3458)).\r\n\r\nThis\
    \ is affecting Flask: with Click 8.4.0, `FLASK_DEBUG=1` in the environment was ignored because `_set_debug`\
    \ runs as an eager callback and could no longer see that the `--debug` flag was only at its default\
    \ ([pallets/flask#6025](https://github.com/pallets/flask/issues/6025)).\r\n\r\nThe fix is to record\
    \ the source right after `consume_value()` and before `process_value()`, matching 8.3.3 timing for\
    \ callbacks and custom types. Flag-group arbitration is the same as today. \r\n\r\nThere is a second,\
    \ narrower issue on the same code path: recording the source early means a *losing* option in a feature-switch\
    \ group briefly overwrites `_parameter_source` before arbitration runs.  I am solving it by restoring\
    \ the previous source when an option loses the slot. That path is easy to miss in tests (shared `opts`\
    \ may give the loser the same source as the winner), so there is a dedicated case in `test_bool_flag_group"
  relevant_files:
  - src/click/core.py
  relevant_symbols:
  - src/click/core.py::Parameter.handle_parse_result
  label_source: fix_commit
  source_ref: https://github.com/pallets/click/pull/3484
  status: candidate
  split: dev
  notes: 'fix commit 7d05a59b9d46a415d85937630d1d812cf477f60a: Fix get_parameter_source() during type
