- id: click-70c673d
  query: "Fix eagerness of help option generated by `help_option_names`\n\nWhen a help option is generated\
    \ by the use of `help_option_names` setting, it loose its eagerness. This issue has an effect on the\
    \ order in which parameters (and their callbacks) are processed, and breaks the evaluation order described\
    \ in the documentation: https://click.palletsprojects.com/en/stable/advanced/#callback-evaluation-order\r\
    \n\r\nThat's because the utility method `iter_params_for_processing()` is comparing option objects,\
    \ and the help option is generated on every  `get_help_option()` or `get_params(ctx)` call. This behavior\
    \ is demonstrated by a unit-test in this PR.\r\n\r\nMy solution to fix this issue consist in caching\
    \ locally the auto-generated help option. This solves the issue.\r\n\r\nI used this oportunity to\
    \ clarify some documentation, and unit-test the main method responsible for the ordering of parameters.\r\
    \n\r\nThis is more or less a follow up of #2563, which has been merged in the upcoming v8.1.8 release.\r\
    \n\r\nChecklist:\r\n\r\n- [x] Add tests that demonstrate the correct behavior of the change. Tests\
    \ should fail without the change.\r\n- [x] Add or update relevant docs, in the docs folder and in\
    \ code.\r\n- [x] Add an entry in `CHANGES.rst` summarizing the change and linking to the issue.\r\n\
    - [x] Add `.. versionchanged::` entries in any relevant code docs.\r\n- [x] Run pre-commit hooks and\
    \ fix any issues.\r\n- [x] Run `pytest` and `tox`, no tests failed."
